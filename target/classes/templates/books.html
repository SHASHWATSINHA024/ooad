<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books Catalog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Books Catalog</h1>
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Coin Price</th>
                    <th>Borrow Count</th>
                    <th>Publish Date</th>
                    <th>Average Rating</th>
                    <th>Available Copies</th>
                    <th>Total Copies</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.isbn}"></td>
                    <td th:text="${book.description}"></td>
                    <td th:text="${book.category}"></td>
                    <td th:text="${book.price}"></td>
                    <td th:text="${book.stock}"></td>
                    <td th:text="${book.coinPrice}"></td>
                    <td th:text="${book.borrowCount}"></td>
                    <td th:text="${book.publishDate}"></td>
                    <td th:text="${book.averageRating}"></td>
                    <td th:text="${book.availableCopies}"></td>
                    <td th:text="${book.totalCopies}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
