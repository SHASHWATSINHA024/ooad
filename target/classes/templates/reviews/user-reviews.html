<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - Library Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .rating {
            color: #ffc107;
        }
        .review-card {
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .edit-form {
            display: none;
        }
    </style>
</head>
<body>
    <div th:replace="fragments/header :: header"></div>
    
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-12">
                <h1 class="mb-4">My Reviews</h1>
                
                <!-- Alert Messages -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Empty state -->
                <div th:if="${userReviews.empty}" class="text-center py-5">
                    <i class="bi bi-chat-square-text" style="font-size: 4rem; color: #dee2e6;"></i>
                    <h5 class="mt-3">You haven't written any reviews yet</h5>
                    <p>Share your thoughts about our library services!</p>
                    <a th:href="@{/reviews}" class="btn btn-primary">Write a Review</a>
                </div>
                
                <!-- User reviews listing -->
                <div th:unless="${userReviews.empty}">
                    <p class="mb-4">
                        <a th:href="@{/reviews}" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Write a New Review
                        </a>
                    </p>
                    
                    <div th:each="review, stat : ${userReviews}" class="card review-card shadow-sm">
                        <!-- View mode -->
                        <div th:id="'review-view-' + ${review.id}" class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0" th:text="${review.title}">Great Library!</h5>
                                <div class="rating">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                                        <i th:class="${i <= review.rating ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                                    </span>
                                </div>
                            </div>
                            <p class="card-text" th:text="${review.reviewText}">This library offers an excellent selection of books and a peaceful environment for studying.</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}">10 Oct 2023</small>
                                <div>
                                    <button th:onclick="'toggleEditForm(' + ${stat.index} + ')'" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                    <a th:href="@{/reviews/delete/{id}(id=${review.id})}" 
                                       class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('Are you sure you want to delete this review?')">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Edit mode -->
                        <div th:id="'review-edit-' + ${stat.index}" class="card-body edit-form">
                            <form th:action="@{/reviews/update/{id}(id=${review.id})}" method="post">
                                <div class="mb-3">
                                    <label for="editRating" class="form-label">Rating</label>
                                    <select class="form-select" id="editRating" name="rating" required>
                                        <option value="1" th:selected="${review.rating == 1}">1 - Poor</option>
                                        <option value="2" th:selected="${review.rating == 2}">2 - Fair</option>
                                        <option value="3" th:selected="${review.rating == 3}">3 - Good</option>
                                        <option value="4" th:selected="${review.rating == 4}">4 - Very Good</option>
                                        <option value="5" th:selected="${review.rating == 5}">5 - Excellent</option>
                                    </select>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="editTitle" class="form-label">Title</label>
                                    <input type="text" class="form-control" id="editTitle" name="title" 
                                           th:value="${review.title}" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="editReviewText" class="form-label">Your Review</label>
                                    <textarea class="form-control" id="editReviewText" name="reviewText" 
                                              rows="4" required th:text="${review.reviewText}"></textarea>
                                </div>
                                
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" th:onclick="'toggleEditForm(' + ${stat.index} + ')'" class="btn btn-secondary">
                                        Cancel
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="fragments/footer :: footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleEditForm(index) {
            const viewDiv = document.getElementById('review-view-' + index);
            const editDiv = document.getElementById('review-edit-' + index);
            
            if (editDiv.style.display === 'block') {
                editDiv.style.display = 'none';
                viewDiv.style.display = 'block';
            } else {
                editDiv.style.display = 'block';
                viewDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
