<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Book Details')"></head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <div class="container mt-4">
        <div th:replace="fragments/layout :: alert"></div>
        
        <div class="row">
            <!-- Book Details -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title" th:text="${book.title}">Book Title</h1>
                        <h4 class="card-subtitle mb-3 text-muted" th:text="${book.author}">Author</h4>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <p><strong>ISBN:</strong> <span th:text="${book.isbn}">ISBN</span></p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Stock:</strong> <span th:text="${book.stock}">0</span></p>
                                <p><strong>Category:</strong> <span th:text="${book.category}">Category</span></p>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>Description</h5>
                            <p th:text="${book.description}">Book description goes here.</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Actions</h5>

                        <!-- Buy Book Button -->
                        <form th:action="@{/books/buy}" method="post" class="mb-3">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button type="submit" class="btn btn-success w-100" th:disabled="${book.stock <= 0}">
                                <i class="fas fa-shopping-cart"></i> Buy Book
                            </button>
                        </form>

                        <!-- Add to Wishlist Button -->
                        <button id="addToWishlistBtn" class="btn btn-primary w-100 mb-3" 
                                th:attr="data-book-id=${book.id}" onclick="addToWishlist()">
                            <i class="fas fa-heart"></i> Add to Wishlist
                        </button>

                        <!-- Success/Failure Message -->
                        <div id="wishlistMessage" class="mt-3" style="display: none;"></div>

                        <!-- Request Book Button -->
                        <form th:action="@{/books/request}" method="post" class="mb-3">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button type="submit" class="btn btn-warning w-100">
                                <i class="fas fa-book"></i> Request Book
                            </button>
                        </form>

                        <!-- Back to Catalog -->
                        <a th:href="@{/books}" class="btn btn-secondary w-100">
                            <i class="fas fa-arrow-left"></i> Back to Catalog
                        </a>
                    </div>
                </div>

                <!-- Review Form -->
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Write a Review</h5>
                        <form th:action="@{/books/review}" method="post" id="reviewForm">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            
                            <!-- Rating Input (1-5 stars) -->
                            <div class="form-group">
                                <label for="rating">Rating (1 to 5):</label>
                                <select id="rating" name="rating" class="form-control" required>
                                    <option value="1">1 Star</option>
                                    <option value="2">2 Stars</option>
                                    <option value="3">3 Stars</option>
                                    <option value="4">4 Stars</option>
                                    <option value="5">5 Stars</option>
                                </select>
                            </div>
                            
                            <!-- Review Text -->
                            <div class="form-group">
                                <textarea name="review" class="form-control" rows="4" placeholder="Write your review here..." required></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-primary mt-3 w-100">Submit Review</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="fragments/layout :: footer"></footer>

    <!-- JavaScript Section -->
    <script>
        // AJAX for review submission
        document.getElementById("reviewForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const bookId = document.querySelector("input[name='bookId']").value;
            const rating = document.querySelector("select[name='rating']").value;
            const review = document.querySelector("textarea[name='review']").value;

            fetch('/books/review', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `bookId=${bookId}&rating=${rating}&review=${review}`
            })
            .then(response => response.text())
            .then(data => {
                alert("Review submitted successfully!");
                window.location.reload();
            })
            .catch(error => alert("Failed to submit the review."));
        });

        // AJAX for adding to wishlist
        function addToWishlist() {
            const bookId = document.getElementById("addToWishlistBtn").getAttribute("data-book-id");
            const messageDiv = document.getElementById("wishlistMessage");

            fetch('/books/wishlist', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ bookId: bookId })
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.style.display = 'block';
                messageDiv.textContent = data.message;
                if (data.success) {
                    messageDiv.classList.add("text-success");
                    messageDiv.classList.remove("text-danger");
                } else {
                    messageDiv.classList.add("text-danger");
                    messageDiv.classList.remove("text-success");
                }
            })
            .catch(error => {
                messageDiv.style.display = 'block';
                messageDiv.textContent = "Failed to add to wishlist.";
                messageDiv.classList.add("text-danger");
            });
        }
    </script>
</body>
</html>
