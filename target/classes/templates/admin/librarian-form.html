<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${librarian.id == null ? 'Add New Librarian' : 'Edit Librarian'})">
    <meta charset="UTF-8">
    <title>Librarian Form</title>
</head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <div class="container mt-5">
        <div th:replace="fragments/layout :: alert"></div>
        
        <div class="card">
            <div class="card-header">
                <h3 th:text="${librarian.id == null ? 'Add New Librarian' : 'Edit Librarian: ' + librarian.username}">Librarian Form</h3>
            </div>
            <div class="card-body">
                <form th:action="${librarian.id == null ? '/admin/librarians/add' : '/admin/librarians/' + librarian.id + '/edit'}" 
                      method="post" th:object="${librarian}">
                    
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="mb-3" th:if="${librarian.id == null}">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}" required>
                    </div>
                    
                    <div class="mb-3" th:if="${librarian.id == null}">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" th:field="*{address}" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3" th:if="${librarian.id != null}">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-control" id="status" th:field="*{status}">
                            <option value="ACTIVE">Active</option>
                            <option value="SUSPENDED">Suspended</option>
                        </select>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/admin/dashboard" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Librarian</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
