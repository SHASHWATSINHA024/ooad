<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Book Catalog')"></head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <div class="container mt-4">
        <div th:replace="fragments/layout :: alert"></div>
        
        <h1>Book Catalog</h1>
        
        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form action="/books/search" method="get" class="d-flex mb-4">
                    <input type="text" name="keyword" class="form-control me-2" placeholder="Search books..." required>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.category}"></td>
                    <td th:text="${book.price}"></td>
                </tr>
            </tbody>
        </table>
        
        <!-- Book Grid -->
        <div class="row">
            <div class="col-md-4 mb-4" th:each="book : ${books}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${book.title}">Book Title</h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${book.author}">Author</h6>
                        <p class="card-text">
                            <small class="text-muted">ISBN: <span th:text="${book.isbn}">ISBN</span></small><br>
                            <small class="text-muted">Available: <span th:text="${book.availableCopies}">0</span></small>
                        </p>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/books/view/{id}(id=${book.id})}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
            
            <div class="col-12" th:if="${books.isEmpty()}">
                <div class="alert alert-info">
                    No books found in the catalog.
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
