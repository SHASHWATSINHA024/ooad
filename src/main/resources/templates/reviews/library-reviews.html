<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/layout :: head('Library Reviews')">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Reviews - Library Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .rating {
            color: #ffc107;
        }
        .review-card {
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .review-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .stars-container {
            margin-bottom: 15px;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: #e0e0e0;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-btn.active {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-12">
                <h1 class="mb-4">Library Reviews</h1>
                
                <!-- Alert Messages -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Overall Rating -->
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <h4>Overall Library Rating</h4>
                        <div class="rating">
                            <span th:each="i : ${#numbers.sequence(1, 5)}">
                                <i th:class="${i <= averageRating ? 'bi bi-star-fill' : (i <= averageRating + 0.5 ? 'bi bi-star-half' : 'bi bi-star')}"></i>
                            </span>
                        </div>
                        <h3 th:text="${#numbers.formatDecimal(averageRating, 0, 1)}">4.5</h3>
                        <p th:text="${reviews != null ? reviews.size() : 0} + ' reviews'"></p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Submit Review Form -->
        <div class="row mb-4">
            <div class="col-lg-12">
                <div class="review-form">
                    <h3 class="mb-3">Write a Review</h3>
                    <form th:action="@{/reviews/add}" method="post" id="reviewForm">
                        <input type="hidden" id="ratingInput" name="rating" value="0">
                        
                        <div class="stars-container text-center">
                            <button type="button" class="star-btn" data-rating="1"><i class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-rating="2"><i class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-rating="3"><i class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-rating="4"><i class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-rating="5"><i class="bi bi-star"></i></button>
                        </div>
                        
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="reviewText" class="form-label">Your Review</label>
                            <textarea class="form-control" id="reviewText" name="reviewText" rows="4" required></textarea>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Submit Review</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Review Listing -->
        <div class="row">
            <div class="col-lg-12">
                <h3 class="mb-4">Recent Reviews</h3>
                
                <!-- Empty state -->
                <div th:if="${reviews == null || #lists.isEmpty(reviews)}" class="text-center py-5">
                    <i class="bi bi-chat-square-text" style="font-size: 4rem; color: #dee2e6;"></i>
                    <h5 class="mt-3">No reviews yet</h5>
                    <p>Be the first to share your experience!</p>
                </div>
                
                <!-- Review cards -->
                <div th:unless="${reviews == null || #lists.isEmpty(reviews)}">
                    <div th:each="review : ${reviews}" class="card review-card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0" th:text="${review.title}">Great Library!</h5>
                                <div class="rating">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                                        <i th:class="${i <= review.rating ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                                    </span>
                                </div>
                            </div>
                            <p class="card-text" th:text="${review.reviewText}">This library offers an excellent selection of books and a peaceful environment for studying.</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted" th:text="${review.reviewDate != null ? #temporals.format(review.reviewDate, 'dd MMM yyyy') : 'No date'}">10 Oct 2023</small>
                                <small class="text-muted" th:text="${review.userName}">John Doe</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="fragments/layout :: footer"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stars = document.querySelectorAll('.star-btn');
            const ratingInput = document.getElementById('ratingInput');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = this.getAttribute('data-rating');
                    ratingInput.value = rating;
                    
                    // Update stars
                    stars.forEach(s => {
                        const starRating = s.getAttribute('data-rating');
                        const icon = s.querySelector('i');
                        
                        if (starRating <= rating) {
                            icon.classList.remove('bi-star');
                            icon.classList.add('bi-star-fill');
                            s.classList.add('active');
                        } else {
                            icon.classList.remove('bi-star-fill');
                            icon.classList.add('bi-star');
                            s.classList.remove('active');
                        }
                    });
                });
                
                star.addEventListener('mouseover', function() {
                    const rating = this.getAttribute('data-rating');
                    
                    stars.forEach(s => {
                        const starRating = s.getAttribute('data-rating');
                        const icon = s.querySelector('i');
                        
                        if (starRating <= rating) {
                            icon.classList.remove('bi-star');
                            icon.classList.add('bi-star-fill');
                        }
                    });
                });
                
                star.addEventListener('mouseout', function() {
                    const currentRating = ratingInput.value;
                    
                    stars.forEach(s => {
                        const starRating = s.getAttribute('data-rating');
                        const icon = s.querySelector('i');
                        
                        if (starRating <= currentRating) {
                            icon.classList.remove('bi-star');
                            icon.classList.add('bi-star-fill');
                        } else {
                            icon.classList.remove('bi-star-fill');
                            icon.classList.add('bi-star');
                        }
                    });
                });
            });
            
            // Form validation
            document.getElementById('reviewForm').addEventListener('submit', function(e) {
                if (ratingInput.value === '0') {
                    e.preventDefault();
                    alert('Please select a rating');
                }
            });
        });
    </script>
</body>
</html>
