# Server configuration
    server.port=8081
    server.error.whitelabel.enabled=false
    server.error.include-message=always
    server.error.include-binding-errors=always
    server.error.include-stacktrace=always
    server.error.include-exception=false
    
    # MySQL Configuration
    spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=rock123456
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    # Hibernate DDL Auto (update will preserve existing data)
    spring.jpa.hibernate.ddl-auto=update

    # Show SQL queries in the console (optional)
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true

    # JPA Database dialect
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

    # Thymeleaf Configuration
    spring.thymeleaf.cache=false
    spring.thymeleaf.mode=HTML
    spring.thymeleaf.encoding=UTF-8
    spring.thymeleaf.prefix=classpath:/templates/
    spring.thymeleaf.suffix=.html

    # Data initialization
    spring.sql.init.mode=never

    # Logging Configuration
    logging.level.org.hibernate.SQL=DEBUG
    logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
